name: Approve and Promote to Staging

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Validated dev image Git SHA (40 lowercase hex characters)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate promotion candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate image SHA
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: image SHA must be 40 lowercase hexadecimal characters."
            exit 1
          fi

          git fetch origin main

          if ! git cat-file -e "${IMAGE_SHA}^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$IMAGE_SHA" origin/main; then
            echo "Error: SHA must identify a commit on main."
            exit 1
          fi

          echo "Promotion candidate validated: $IMAGE_SHA"

  promote:
    name: Approve and update staging
    needs: validate
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Revalidate image SHA
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          git fetch origin main

          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git cat-file -e "${IMAGE_SHA}^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$IMAGE_SHA" origin/main; then
            echo "Error: SHA is invalid or is no longer on main."
            exit 1
          fi

      - name: Update staging image tag
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          FILE="gitops/environments/staging/demo-app.yaml"

          if ! grep -qE '^          tag: "[0-9a-f]{40}"$' "$FILE"; then
            echo "Error: expected staging image tag not found."
            exit 1
          fi

          sed -i \
            's|^\(          tag: \)"[0-9a-f]\{40\}"$|\1"'"$IMAGE_SHA"'"|' \
            "$FILE"

          git diff --check
          git diff -- "$FILE"

      - name: Commit and push promotion
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          FILE="gitops/environments/staging/demo-app.yaml"

          if git diff --quiet -- "$FILE"; then
            echo "Staging already uses this image SHA."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "Promote staging image to ${IMAGE_SHA} [skip ci]"
          git push origin HEAD:main
