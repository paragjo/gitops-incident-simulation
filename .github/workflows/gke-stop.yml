
name: Stop GitOps GKE

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gitops-gke-lifecycle
  cancel-in-progress: false

jobs:
  stop:
    name: Destroy GKE infrastructure
    runs-on: ubuntu-latest
    environment: gke-lifecycle

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Destroy GKE environment
        run: bash scripts/stop-gke.sh
